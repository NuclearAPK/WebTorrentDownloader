<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebTorrent Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Секция авторизации -->
  <section id="authSection" class="auth-section">
    <div class="auth-container">
      <h1>WebTorrent Downloader</h1>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Вход</button>
        <button class="auth-tab" data-tab="register">Регистрация</button>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginUsername">Логин</label>
          <input type="text" id="loginUsername" required minlength="3" placeholder="Введите логин">
        </div>
        <div class="form-group">
          <label for="loginPassword">Пароль</label>
          <input type="password" id="loginPassword" required minlength="6" placeholder="Введите пароль">
        </div>
        <button type="submit" class="btn-primary">Войти</button>
      </form>

      <form id="registerForm" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="registerUsername">Логин</label>
          <input type="text" id="registerUsername" required minlength="3" placeholder="Минимум 3 символа">
        </div>
        <div class="form-group">
          <label for="registerPassword">Пароль</label>
          <input type="password" id="registerPassword" required minlength="6" placeholder="Минимум 6 символов">
        </div>
        <button type="submit" class="btn-primary">Зарегистрироваться</button>
      </form>
    </div>
  </section>

  <!-- Секция приложения -->
  <section id="appSection" class="container" style="display: none;">
    <header>
      <h1>WebTorrent Downloader</h1>
      <div class="user-info">
        <span id="usernameDisplay"></span>
        <button id="logoutBtn" class="btn-secondary">Выйти</button>
      </div>
    </header>

    <main>
      <!-- Форма добавления торрента -->
      <section class="add-torrent">
        <h2>Добавить торрент</h2>

        <div class="form-group">
          <label for="magnetUri">Магнет-ссылка:</label>
          <div class="input-row">
            <input type="text" id="magnetUri" placeholder="magnet:?xt=urn:btih:...">
            <button id="addMagnet">Добавить</button>
          </div>
        </div>

        <div class="form-group">
          <label for="torrentFile">.torrent файл:</label>
          <div class="input-row">
            <input type="file" id="torrentFile" accept=".torrent">
            <button id="uploadTorrent">Загрузить</button>
          </div>
        </div>

        <div class="form-group">
          <label for="downloadDir">Каталог загрузки:</label>
          <div class="input-row">
            <input type="text" id="downloadDir" placeholder="Путь к каталогу">
            <button id="changeDir">Изменить</button>
          </div>
        </div>
      </section>

      <!-- Активные загрузки -->
      <section class="active-downloads">
        <h2>Активные загрузки</h2>
        <div id="torrentsList" class="torrents-list">
          <p class="empty-message">Нет активных загрузок</p>
        </div>
      </section>

      <!-- Скачанные файлы -->
      <section class="downloaded-files">
        <h2>Скачанные файлы</h2>
        <button id="refreshFiles" class="refresh-btn">Обновить</button>
        <div id="filesList" class="files-list">
          <p class="empty-message">Нет скачанных файлов</p>
        </div>
      </section>

      <!-- DLNA -->
      <section class="dlna-section">
        <h2>DLNA / Трансляция</h2>

        <!-- Статус DLNA сервера -->
        <div class="dlna-server-status">
          <div class="dlna-server-info">
            <span class="dlna-server-indicator" id="dlnaServerIndicator"></span>
            <span id="dlnaServerStatusText">DLNA сервер остановлен</span>
          </div>
          <div class="dlna-server-controls">
            <button id="startDlnaServer" class="btn-small">Запустить сервер</button>
            <button id="stopDlnaServer" class="btn-small btn-secondary" style="display: none;">Остановить</button>
          </div>
        </div>

        <!-- Устройства -->
        <div class="dlna-devices">
          <div class="dlna-devices-header">
            <h3>Устройства в сети</h3>
            <button id="scanDevices" class="btn-small">Сканировать</button>
          </div>
          <div id="devicesList" class="devices-list">
            <p class="empty-message">Нет устройств</p>
          </div>
        </div>

        <!-- Панель воспроизведения -->
        <div id="playbackPanel" class="playback-panel" style="display: none;">
          <div class="playback-info">
            <span class="playback-device" id="playbackDevice"></span>
            <span class="playback-status" id="playbackStatus"></span>
          </div>
          <div class="playback-progress">
            <span id="playbackPosition">0:00</span>
            <div class="playback-bar">
              <div class="playback-bar-fill" id="playbackBarFill"></div>
            </div>
            <span id="playbackDuration">0:00</span>
          </div>
          <div class="playback-controls">
            <button id="playBtn" class="playback-btn">Play</button>
            <button id="pauseBtn" class="playback-btn">Pause</button>
            <button id="stopBtn" class="playback-btn btn-danger">Stop</button>
          </div>
        </div>
      </section>
    </main>
  </section>

  <!-- Футер -->
  <footer class="app-footer">
    <span>WebTorrent Downloader <span id="appVersion">v1.0.5</span></span>
    <a href="https://github.com/NuclearAPK/WebTorrentDownloader" target="_blank" rel="noopener noreferrer" class="github-link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
  </footer>

  <!-- Уведомления -->
  <div id="notifications" class="notifications"></div>

  <script src="app.js"></script>
</body>
</html>
